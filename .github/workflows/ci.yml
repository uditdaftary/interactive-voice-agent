name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          # requirements.txt was removed in S0.1; pyproject.toml is the dependency source.
          cache-dependency-path: pyproject.toml

      - name: Install PortAudio for sounddevice
        run: sudo apt-get update && sudo apt-get install -y libportaudio2

      - name: Install project with dev extras
        run: pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy
