[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-agent"
version = "0.1.0"
description = "Local Interactive AI Voice Agent"
authors = [{ name = "Udit Daftary" }]
dependencies = [
    "numpy>=1.24.0,<2.1.0",
    "scipy>=1.11.0",
    "sounddevice>=0.4.6",
    "onnxruntime>=1.17.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1",
    "colorama>=0.4.6",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "websockets>=12.0",
    "httpx>=0.27.0"
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
