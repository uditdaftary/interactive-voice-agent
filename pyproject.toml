[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-agent"
version = "0.3.0"
description = "Local Interactive AI Voice Agent with Continuous Narration, Hardware DSP, and Web Search Grounding"
authors = [{ name = "Udit Daftary" }]
dependencies = [
    "numpy>=1.24.0,<2.1.0",
    "scipy>=1.11.0",
    "sounddevice>=0.4.6",
    "pydantic>=2.6.0",
    "colorama>=0.4.6",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "websockets>=12.0",
    "httpx>=0.27.0",
    "pypdf>=5.0.0",
    "edge-tts>=7.0.0",
    "pyttsx3>=2.90",
    "faster-whisper>=1.0",
    "ddgs>=9.0",
    "python-multipart>=0.0.18"
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.17,<0.18", "mypy>=1.10"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
